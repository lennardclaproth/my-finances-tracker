info:
  contact: {}
paths:
  /accounts:
    get:
      consumes:
      - application/json
      description: Lists all available accounts.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AccountResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: Creates a new account.
      parameters:
      - description: Create account payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create account
      tags:
      - accounts
  /assets/classes:
    get:
      consumes:
      - application/json
      description: Returns asset classes with totals and growth metadata.
      parameters:
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      - description: Include archived classes
        in: query
        name: include_archived
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AssetClassResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List asset classes
      tags:
      - assets
    patch:
      consumes:
      - application/json
      description: Updates manual asset class name and archived state.
      parameters:
      - description: Update asset class payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateAssetClassRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update asset class
      tags:
      - assets
    post:
      consumes:
      - application/json
      description: Creates a manual asset class for the selected account.
      parameters:
      - description: Create asset class payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateAssetClassRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.AssetClassResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create asset class
      tags:
      - assets
  /assets/classes/{class_id}:
    delete:
      consumes:
      - application/json
      description: Deletes a manual class and its items/history.
      parameters:
      - description: Class ID
        in: path
        name: class_id
        required: true
        type: string
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete asset class
      tags:
      - assets
    get:
      consumes:
      - application/json
      description: Returns class details for drawer rendering.
      parameters:
      - description: Class ID
        in: path
        name: class_id
        required: true
        type: string
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AssetClassDetailsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get asset class details
      tags:
      - assets
  /assets/items:
    post:
      consumes:
      - application/json
      description: Adds a tracked asset item and records its initial worth.
      parameters:
      - description: Create asset item payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateAssetItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.AssetItemResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create asset item
      tags:
      - assets
  /assets/items/worth/adjust:
    post:
      consumes:
      - application/json
      description: Applies increase/decrease delta using non-future effective date.
      parameters:
      - description: Adjust worth payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AdjustAssetItemWorthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Adjust asset item worth
      tags:
      - assets
  /assets/items/worth/set:
    post:
      consumes:
      - application/json
      description: Replaces item worth using a non-future effective date.
      parameters:
      - description: Set worth payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.SetAssetItemWorthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set asset item worth
      tags:
      - assets
  /assets/snapshots:
    get:
      consumes:
      - application/json
      description: Returns account-level daily total worth snapshot points.
      parameters:
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AssetGrowthPointResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List asset snapshots
      tags:
      - assets
  /cashflow/analytics/monthly:
    get:
      consumes:
      - application/json
      description: Returns monthly incoming, outgoing and net totals for the selected
        range.
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: Include ignored transactions
        in: query
        name: include_ignored
        type: boolean
      produces:
      - application/json
      responses:
        "200":
