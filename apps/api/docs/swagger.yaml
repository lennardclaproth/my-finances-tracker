info:
  contact: {}
paths:
  /accounts:
    get:
      description: Returns all accounts.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/account.AccountResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: Creates a new account.
      parameters:
      - description: Create account payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/account.CreateAccountResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create account
      tags:
      - accounts
  /assets:
    post:
      consumes:
      - application/json
      description: Adds a tracked asset and records its initial worth.
      parameters:
      - description: Create asset payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/assets.CreateAssetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/assets.CreateAssetResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create asset
      tags:
      - assets
  /assets/{asset_id}/adjust:
    put:
      consumes:
      - application/json
      description: Applies increase/decrease delta using non-future effective date.
      parameters:
      - description: Asset ID
        in: path
        name: asset_id
        required: true
        type: string
      - description: Adjust worth payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/assets.AdjustAssetWorthRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Adjust asset worth
      tags:
      - assets
  /assets/{asset_id}/worth:
    put:
      consumes:
      - application/json
      description: Replaces item worth using a non-future effective date.
      parameters:
      - description: Set worth payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/assets.SetAssetWorthRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set asset item worth
      tags:
      - assets
  /assets/classes:
    get:
      consumes:
      - application/json
      description: Returns asset classes with totals and growth metadata.
      parameters:
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      - description: Include archived classes
        in: query
        name: include_archived
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/assets.ClassResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List asset classes
      tags:
      - assets
    patch:
      consumes:
      - application/json
      description: Updates manual class name and archived state.
      parameters:
      - description: Update asset class payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/assets.UpdateClassRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update class
      tags:
      - assets
    post:
      consumes:
      - application/json
      description: Creates a manual asset class for the selected account.
      parameters:
      - description: Create asset class payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/assets.CreateAssetClassRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/assets.CreateAssetClassResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create asset class
      tags:
      - assets
  /assets/classes/{class_id}:
    delete:
      consumes:
      - application/json
      description: Deletes a manual class and its items/mutations.
      parameters:
      - description: Class ID
        in: path
        name: class_id
        required: true
        type: string
      - description: Delete class payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/assets.DeleteClassRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete class
      tags:
      - assets
    get:
      consumes:
      - application/json
      description: Returns class details for drawer rendering.
      parameters:
      - description: Class ID
        in: path
        name: class_id
        required: true
        type: string
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assets.ClassDetailsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get asset class details
      tags:
      - assets
  /assets/snapshots:
    get:
      consumes:
      - application/json
      description: Returns account-level daily total worth snapshot points.
      parameters:
      - description: Account ID
        in: query
        name: account_id
        required: true
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/assets.SnapshotResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List asset snapshots
      tags:
      - assets
  /cashflow/analytics/monthly:
    get:
      consumes:
      - application/json
      description: Returns monthly incoming, outgoing and net totals for the selected
        range.
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: Include ignored transactions
        in: query
        name: include_ignored
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cashflow.CashflowMonthlyAnalyticsResponse'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get cashflow monthly analytics
      tags:
      - Transactions
  /cashflow/analytics/tags:
    get:
      consumes:
      - application/json
      description: Returns tag distribution for combined, incoming and outgoing transactions
        in the selected range.
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: Include ignored transactions
        in: query
        name: include_ignored
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cashflow.TagDistributionResponse'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
