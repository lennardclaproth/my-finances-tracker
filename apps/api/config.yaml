server:
  environment: development  # development or production
  port: 6060                # HTTP server port
  # Browser origins allowed to call the API cross-origin. Defaults to the
  # SvelteKit dev server (http://localhost:5199) when omitted. Use ["*"] to
  # allow any origin (dev only).
  cors_allowed_origins:
    - http://localhost:5199

database:
  # postgres (deployed / local via deploy/docker/compose.dev.yaml) or sqlite3 (zero-infra local).
  type: postgres
  connection_string: "postgres://admin:Postgres2026%21@127.0.0.1:5432/my_finances_tracker?sslmode=disable"

logging:
  level: info  # debug, info, warn, error

apm:
  server_url: http://localhost:8200
  service_name: my-finances-tracker
  environment: development
  secret_token: 
  verify_server_cert: false
  log_level: warn

disk_storage:
  base_path: C:\mft
